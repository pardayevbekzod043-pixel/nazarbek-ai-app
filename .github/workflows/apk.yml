name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Android APK
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www && cp index.html www/
          echo '{"appId":"com.nazarbek.aiapp","appName":"Nazarbek AI","webDir":"www","server":{"url":"https://pardayevbekzod043-pixel.github.io/nazarbek-ai-app/"}}' > capacitor.config.json
          npx cap add android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Nazarbek-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
