<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nazarbek AI</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}body{background:#0f172a;color:#fff;height:100dvh;display:flex;flex-direction:column}header{background:#1e293b;padding:15px;font-weight:bold;border-bottom:1px solid #334155}#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}.msg{max-width:85%;padding:12px;border-radius:15px;font-size:15px;line-height:1.4}.bot{background:#1e293b;align-self:flex-start}.user{background:#2563eb;align-self:flex-end}form{background:#1e293b;padding:10px;display:flex;gap:8px}input{flex:1;background:#0f172a;border:1px solid #334155;color:#fff;padding:12px;border-radius:20px}button{background:#3b82f6;color:#fff;border:none;width:45px;height:45px;border-radius:50%;font-weight:bold}</style></head><body><header>🤖 Nazarbek AI (24/7 Onlayn)</header><div id="chat"><div class="msg bot">Assalomu alaykum! Men Nazarbek yaratgan sun'iy intellekt ilovasiman. Savolingizni yozing!</div></div><form id="f"><input id="i" placeholder="Savolingizni yozing..." required><button>➤</button></form><script>const c=document.getElementById('chat'),f=document.getElementById('f'),i=document.getElementById('i');function a(t,s){const d=document.createElement('div');d.className='msg '+s;d.textContent=t;c.appendChild(d);c.scrollTop=c.scrollHeight;return d}f.onsubmit=async e=>{e.preventDefault();const q=i.value.trim();if(!q)return;i.value='';a(q,'user');const w=a('Yozmoqda...','bot');const k=q.toLowerCase();if(k.includes('kim yarat')||k.includes('kim och')){w.textContent="Men Nazarbek tomonidan yaratilgan mukammal sun'iy intellektman!";return}if(k.includes('salom')||k.includes('qalay')||k.includes('nima gap')){w.textContent="Vaalaykum assalom! Hammasi zo'r, Nazarbek AI xizmatingizda!";return}if(k.includes('24 soat')){w.textContent="Ha, men 24/7 tun-u kun uxlamasdan ishlayman!";return}try{const r=await fetch('https://wikipedia.org*');const d=await r.json();const res=d.query.search;w.textContent=res&&res.length?res.snippet.replace(/<[^>]+>/g,'')+'...':"Bu mavzu bo'yicha ma'lumot topilmadi, boshqacha so'z yozing!"}catch{w.textContent="Internet aloqasini tekshiring."}}</script></body></html>
